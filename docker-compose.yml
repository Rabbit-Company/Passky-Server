services:
  passky-server:
    container_name: passky-server
    image: "rabbitcompany/passky-server:latest"
    restart: unless-stopped
    environment:
      #
      # Change environment variables in .env file
      # You can also run an installer.sh that would auto generate .env file
      # or run installerGUI.sh for graphical configuration.
      #
      # Server
      - SERVER_LOCATION
      - SERVER_CORES
      - SERVER_HOST
      - SERVER_PORT
      - TRUSTED_PROXIES
      - BURROWGATE_ORIGIN_SECRET
      # Admin Panel
      - ADMIN_USERNAME
      - ADMIN_PASSWORD
      - ADMIN_SESSION_TTL
      # Cloudflare Captcha
      - CF_TURNSTILE_SITE_KEY
      - CF_TURNSTILE_SECRET_KEY
      # Database
      - DATABASE_URL
      - DATABASE_ENGINE
      - DATABASE_FILE
      - MYSQL_HOST
      - MYSQL_PORT
      - MYSQL_DATABASE
      - MYSQL_USER
      - MYSQL_PASSWORD
      - MYSQL_SSL
      - MYSQL_SSL_CA
      - MYSQL_CACHE_MODE
      # Argon2id
      - ARGON2_MEMORY_COST
      - ARGON2_TIME_COST
      # Observability
      - METRICS_ENABLED
      - METRICS_TOKEN
      - REPORTS_ENABLED
      - LOG_PRESET
      - LOKI_URL
      - LOKI_USERNAME
      - LOKI_PASSWORD
      # Redis
      - REDIS_HOST
      - REDIS_PORT
      - REDIS_PASSWORD
      - REDIS_URL
      # Mail
      - MAIL_ENABLED
      - MAIL_HOST
      - MAIL_PORT
      - MAIL_USERNAME
      - MAIL_PASSWORD
      - MAIL_USE_TLS
      # Account
      - ACCOUNT_MAX
      - ACCOUNT_MAX_PASSWORDS
      - ACCOUNT_PREMIUM
      # YUBICO
      - YUBI_CLOUD
      - YUBI_ID
      # Limiter
      - LIMITER_ENABLED
      - LIMITER_GET_INFO
      - LIMITER_GET_STATS
      - LIMITER_GET_TOKEN
      - LIMITER_GET_PASSWORDS
      - LIMITER_SAVE_PASSWORD
      - LIMITER_EDIT_PASSWORD
      - LIMITER_DELETE_PASSWORD
      - LIMITER_DELETE_PASSWORDS
      - LIMITER_CREATE_ACCOUNT
      - LIMITER_DELETE_ACCOUNT
      - LIMITER_IMPORT_PASSWORDS
      - LIMITER_FORGOT_USERNAME
      - LIMITER_ENABLE_2FA
      - LIMITER_DISABLE_2FA
      - LIMITER_ADD_YUBIKEY
      - LIMITER_REMOVE_YUBIKEY
      - LIMITER_UPGRADE_ACCOUNT
      - LIMITER_GET_REPORT
    ports:
      - 8080:80
    volumes:
      - ./databases:/app/databases
