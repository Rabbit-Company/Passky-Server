<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="564" viewBox="0 0 1170 564" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">Passky compared with other password managers</title>
<desc id="description">Premium price: Passky $2.00/mo, Bitwarden $1.65/mo, NordPass $1.99/mo, Dashlane $4.99/mo, 1Password $3.99/mo, LastPass $3.00/mo. Free plan: Passky 100 passwords, Bitwarden Unlimited, NordPass 1 active device, Dashlane None, 1Password None, LastPass 1 device type. Premium passwords: Passky Unlimited, Bitwarden Unlimited, NordPass Unlimited, Dashlane Unlimited, 1Password Unlimited, LastPass Unlimited. Two-factor authentication: Passky Yes, Bitwarden Yes, NordPass Yes, Dashlane Yes, 1Password Yes, LastPass Yes. Zero-knowledge encryption: Passky Yes, Bitwarden Yes, NordPass Yes, Dashlane Yes, 1Password Yes, LastPass Yes. Encryption: Passky XChaCha20, Bitwarden AES-256, NordPass XChaCha20, Dashlane AES-256, 1Password AES-256, LastPass AES-256. Key derivation: Passky Argon2id, Bitwarden PBKDF2 or Argon2id, NordPass Argon2, Dashlane Argon2d, 1Password PBKDF2, LastPass PBKDF2. Open source: Passky Yes, Bitwarden Yes, NordPass No, Dashlane Partial, 1Password No, LastPass No. Self-hosting: Passky Yes, Bitwarden Yes, NordPass No, Dashlane No, 1Password No, LastPass No.</desc>
